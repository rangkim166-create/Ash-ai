name: Build Minified Ash Sports Neon Function

on:
  pull_request:
    paths:
      - "neon-functions/ashsports/**"
      - ".github/workflows/ash-sports-minified.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and bundle
        working-directory: neon-functions/ashsports
        run: |
          npm install --no-audit --no-fund
          node --check index.mjs
          npx esbuild index.mjs --bundle --platform=node --target=node24 --format=esm --minify --legal-comments=none --outfile=dist/index.mjs
          node --check dist/index.mjs
          cd dist
          zip -9 -j function.zip index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ash-sports-neon-function-minified
          path: neon-functions/ashsports/dist/function.zip
          retention-days: 7
