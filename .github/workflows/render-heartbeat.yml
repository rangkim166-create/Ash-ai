name: Ash Render heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ash-render-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render engine health
        env:
          HEALTH_URL: https://ash-sports-api.onrender.com/health
        run: |
          echo "Checking Ash Sports Intelligence Render engine"
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 120 \
            --output health.json \
            --write-out "HTTP %{http_code} · total %{time_total}s\n" \
            "$HEALTH_URL"
          cat health.json
