name: Test bookmaker scraper and prediction filters

on:
  push:
    branches:
      - ash-bookmaker-scraper
      - ash-neon-backend
    paths:
      - "neon-functions/ashsports/bookmaker-scraper.mjs"
      - "neon-functions/ashsports/bookmaker-scraper.test.mjs"
      - "neon-functions/ashsports/daily-picks.mjs"
      - "neon-functions/ashsports/daily-picks.test.mjs"
      - "neon-functions/ashsports/fixture-research.mjs"
      - "neon-functions/ashsports/fixture-research.test.mjs"
      - "neon-functions/ashsports/results-tracker.mjs"
      - "neon-functions/ashsports/results-tracker.test.mjs"
      - ".github/workflows/test-bookmaker-scraper.yml"
  pull_request:
    paths:
      - "neon-functions/ashsports/bookmaker-scraper.mjs"
      - "neon-functions/ashsports/bookmaker-scraper.test.mjs"
      - "neon-functions/ashsports/daily-picks.mjs"
      - "neon-functions/ashsports/daily-picks.test.mjs"
      - "neon-functions/ashsports/fixture-research.mjs"
      - "neon-functions/ashsports/fixture-research.test.mjs"
      - "neon-functions/ashsports/results-tracker.mjs"
      - "neon-functions/ashsports/results-tracker.test.mjs"
      - ".github/workflows/test-bookmaker-scraper.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: neon-functions/ashsports
