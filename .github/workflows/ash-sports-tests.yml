name: Ash Sports backend tests

on:
  push:
    branches:
      - ash-neon-backend
      - ash-research-discovery-v2
  pull_request:
    branches:
      - ash-neon-backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Ash Sports tests
        run: npm test
