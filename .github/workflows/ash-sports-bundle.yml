name: Build Ash Sports Function Bundle

on:
  pull_request:
    paths:
      - 'neon-functions/ashsports/**'
      - '.github/workflows/ash-sports-api.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and bundle
        working-directory: neon-functions/ashsports
        run: |
          npm install --no-audit --no-fund
          node --check index.mjs
          npx esbuild index.mjs --bundle --platform=node --target=node24 --format=esm --outfile=dist/index.mjs
          node --check dist/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ash-sports-neon-function-bundle
          path: neon-functions/ashsports/dist/index.mjs
          retention-days: 7
