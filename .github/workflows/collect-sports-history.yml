name: Collect sports history

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download available historical results
        run: python sports_ai/collect_history.py
      - name: Commit updated history and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if ! git diff --cached --quiet; then
            git commit -m "Update sports history datasets"
            git push
          else
            echo "No data changes to commit."
          fi
