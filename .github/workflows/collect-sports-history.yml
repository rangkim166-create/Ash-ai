name: Collect sports history

on:
  workflow_dispatch:
  push:
    paths:
      - "sports_ai/**"
      - ".github/workflows/collect-sports-history.yml"
  schedule:
    - cron: "20 4 * * *"

concurrency:
  group: ash-sports-history-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parquet reader for basketball history
        run: python -m pip install --upgrade pandas pyarrow
      - name: Syntax-check collector and database scripts
        run: python -m py_compile sports_ai/collect_full_history.py sports_ai/build_database.py sports_ai/predict.py sports_ai/publish_ratings.py sports_ai/collect_arab_football.py sports_ai/import_openfootball_txt.py sports_ai/collect_saudi_history.py sports_ai/import_saudi_history.py sports_ai/collect_basketball_history.py sports_ai/import_basketball_history.py
      - name: Download historical datasets
        run: python sports_ai/collect_full_history.py
      - name: Download Saudi Pro League historical archive
        run: python sports_ai/collect_saudi_history.py
      - name: Download basketball results for NBA and international leagues
        run: python sports_ai/collect_basketball_history.py
      - name: Fetch additional Arab and African football source archive
        run: python sports_ai/collect_arab_football.py
      - name: Normalize results into SQLite
        run: python sports_ai/build_database.py
      - name: Import regional OpenFootball text results
        run: python sports_ai/import_openfootball_txt.py
      - name: Import Saudi Pro League history
        run: python sports_ai/import_saudi_history.py
      - name: Import NBA and international basketball history
        run: python sports_ai/import_basketball_history.py
      - name: Package downloaded data and database
        run: |
          cd data/history
          zip -qr ../../ash-sports-history.zip raw full-history-manifest.json ash_sports_history.sqlite
      - name: Upload collected historical datasets
        uses: actions/upload-artifact@v4
        with:
          name: ash-sports-history
          path: ash-sports-history.zip
          if-no-files-found: error
          retention-days: 90
      - name: Commit only the small source manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/full-history-manifest.json
          if [ -f data/history/ratings.json ]; then git add data/history/ratings.json; fi
          if [ -f data/history/football-data-manifest.json ]; then git add data/history/football-data-manifest.json; fi
          if [ -f data/history/raw/football_world/manifest.json ]; then git add data/history/raw/football_world/manifest.json; fi
          if [ -f data/history/raw/arab_football/saudi/manifest.json ]; then git add data/history/raw/arab_football/saudi/manifest.json; fi
          if [ -f data/history/raw/basketball_parquet/manifest.json ]; then git add data/history/raw/basketball_parquet/manifest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update sports history source manifest"
            git push
          else
            echo "Manifest unchanged."
          fi
