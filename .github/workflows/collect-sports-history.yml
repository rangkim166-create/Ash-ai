name: Collect sports history

on:
  workflow_dispatch:
  push:
    paths:
      - "sports_ai/**"
      - ".github/workflows/collect-sports-history.yml"
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check collector and database scripts
        run: python -m py_compile sports_ai/collect_full_history.py sports_ai/build_database.py sports_ai/predict.py sports_ai/publish_ratings.py
      - name: Download historical datasets
        run: python sports_ai/collect_full_history.py
      - name: Normalize results into SQLite
        run: python sports_ai/build_database.py
      - name: Package downloaded data and database
        run: |
          cd data/history
          zip -qr ../../ash-sports-history.zip raw full-history-manifest.json ash_sports_history.sqlite
      - name: Upload collected historical datasets
        uses: actions/upload-artifact@v4
        with:
          name: ash-sports-history
          path: ash-sports-history.zip
          if-no-files-found: error
          retention-days: 90
      - name: Commit only the small source manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/full-history-manifest.json data/history/ratings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sports history source manifest"
            git push
          else
            echo "Manifest unchanged."
          fi
