name: Collect sports history

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download historical datasets
        run: python sports_ai/collect_full_history.py
      - name: Upload manifest as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ash-sports-history-manifest
          path: data/history/full-history-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit collected data and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if ! git diff --cached --quiet; then
            git commit -m "Update collected sports history"
            git push
          else
            echo "No data changes to commit."
          fi
